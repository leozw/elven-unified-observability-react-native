name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, tests, budgets, and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run complete validation
        run: node .yarn/releases/yarn-4.11.0.cjs validate

      - name: Create inspected package artifact
        run: npm pack --ignore-scripts --json > artifacts/npm-pack.json

      - name: Upload validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/
            coverage/
            elven-unified-observability-react-native-*.tgz

  collector-smoke:
    name: Collector OTLP smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Validate Collector configuration
        run: docker compose -f example/docker-compose.yml config --quiet

      - name: Start Collector
        run: docker compose -f example/docker-compose.yml up --detach

      - name: Send correlated OTLP signals
        run: node scripts/smoke-collector.mjs

      - name: Show Collector evidence
        if: always()
        run: docker compose -f example/docker-compose.yml logs --no-color collector

      - name: Stop Collector
        if: always()
        run: docker compose -f example/docker-compose.yml down --volumes

  android-release:
    name: Expo 57 Android release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: '17'

      - name: Prebuild Android project
        run: node .yarn/releases/yarn-4.11.0.cjs example expo prebuild --platform android --no-install

      - name: Build Android release
        run: node .yarn/releases/yarn-4.11.0.cjs example build:android

      - name: Upload Android release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release
          if-no-files-found: error
          retention-days: 14
          path: example/android/app/build/outputs/apk/release/*.apk

  bare-android-release:
    name: Bare RN 0.87 Android release
    runs-on: ubuntu-latest
    env:
      BARE_APP_DIR: ${{ github.workspace }}/.bare-validation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: '17'

      - name: Create bare consumer from the packed SDK
        shell: bash
        run: |
          node .yarn/releases/yarn-4.11.0.cjs build
          package_tarball="$(npm pack --ignore-scripts --silent --pack-destination "$RUNNER_TEMP")"
          npx --yes @react-native-community/cli@20.2.0 init ElvenBareValidation \
            --version 0.87.0 \
            --pm npm \
            --directory "$BARE_APP_DIR" \
            --skip-git-init \
            --install-pods false
          npm install --prefix "$BARE_APP_DIR" --ignore-scripts --save-exact "$RUNNER_TEMP/$package_tarball"
          cp scripts/fixtures/bare-App.tsx "$BARE_APP_DIR/App.tsx"

      - name: Typecheck bare consumer
        working-directory: ${{ github.workspace }}/.bare-validation
        run: npx tsc --noEmit

      - name: Build bare Android release
        working-directory: ${{ github.workspace }}/.bare-validation
        run: NODE_ENV=production ./android/gradlew -p android assembleRelease -Dorg.gradle.jvmargs=-Xmx4g

      - name: Upload bare Android release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bare-rn-087-android-release
          if-no-files-found: error
          retention-days: 14
          path: ${{ github.workspace }}/.bare-validation/android/app/build/outputs/apk/release/*.apk

  ios-release:
    name: Expo 57 iOS release simulator
    runs-on: macos-26
    env:
      RCT_NEW_ARCH_ENABLED: '1'
      RCT_USE_PREBUILT_RNCORE: '1'
      RCT_USE_RN_DEP: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.4.1
        run: sudo xcode-select --switch /Applications/Xcode_26.4.app/Contents/Developer

      - name: Setup
        uses: ./.github/actions/setup

      - name: Prebuild iOS project
        run: node .yarn/releases/yarn-4.11.0.cjs example expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: example/ios
        run: pod install

      - name: Build iOS release simulator
        run: node .yarn/releases/yarn-4.11.0.cjs example build:ios

      - name: Verify bundled SDK privacy manifest
        shell: bash
        run: |
          manifest="$(find example/ios/build/Build/Products/Release-iphonesimulator \
            -path '*/ElvenUnifiedObservabilityReactNativePrivacy.bundle/PrivacyInfo.xcprivacy' \
            -print -quit)"
          test -n "$manifest"
          plutil -lint "$manifest"

      - name: Upload iOS release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-release-simulator
          if-no-files-found: error
          retention-days: 14
          path: example/ios/build/Build/Products/Release-iphonesimulator/*.app

  bare-ios-release:
    name: Bare RN 0.87 iOS release simulator
    runs-on: macos-26
    env:
      BARE_APP_DIR: ${{ github.workspace }}/.bare-validation
      RCT_NEW_ARCH_ENABLED: '1'
      RCT_USE_PREBUILT_RNCORE: '1'
      RCT_USE_RN_DEP: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.4.1
        run: sudo xcode-select --switch /Applications/Xcode_26.4.app/Contents/Developer

      - name: Setup
        uses: ./.github/actions/setup

      - name: Create bare consumer from the packed SDK
        shell: bash
        run: |
          node .yarn/releases/yarn-4.11.0.cjs build
          package_tarball="$(npm pack --ignore-scripts --silent --pack-destination "$RUNNER_TEMP")"
          npx --yes @react-native-community/cli@20.2.0 init ElvenBareValidation \
            --version 0.87.0 \
            --pm npm \
            --directory "$BARE_APP_DIR" \
            --skip-git-init \
            --install-pods false
          npm install --prefix "$BARE_APP_DIR" --ignore-scripts --save-exact "$RUNNER_TEMP/$package_tarball"
          cp scripts/fixtures/bare-App.tsx "$BARE_APP_DIR/App.tsx"

      - name: Typecheck bare consumer
        working-directory: ${{ github.workspace }}/.bare-validation
        run: npx tsc --noEmit

      - name: Install bare consumer CocoaPods
        working-directory: ${{ github.workspace }}/.bare-validation/ios
        run: pod install

      - name: Build bare iOS release simulator
        working-directory: ${{ github.workspace }}/.bare-validation
        run: >-
          xcodebuild
          -workspace ios/ElvenBareValidation.xcworkspace
          -scheme ElvenBareValidation
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/build
          CODE_SIGNING_ALLOWED=NO
          ONLY_ACTIVE_ARCH=YES
          -quiet

      - name: Verify bundled SDK privacy manifest
        shell: bash
        run: |
          manifest="$(find "$BARE_APP_DIR/ios/build/Build/Products/Release-iphonesimulator" \
            -path '*/ElvenUnifiedObservabilityReactNativePrivacy.bundle/PrivacyInfo.xcprivacy' \
            -print -quit)"
          test -n "$manifest"
          plutil -lint "$manifest"

      - name: Upload bare iOS release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bare-rn-087-ios-release-simulator
          if-no-files-found: error
          retention-days: 14
          path: ${{ github.workspace }}/.bare-validation/ios/build/Build/Products/Release-iphonesimulator/*.app

  web-release:
    name: Expo 57 web fallback
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build web export
        run: node .yarn/releases/yarn-4.11.0.cjs example build:web

      - name: Upload web export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-release
          if-no-files-found: error
          retention-days: 14
          path: example/dist/
