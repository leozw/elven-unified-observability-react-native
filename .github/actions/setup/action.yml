name: Setup
description: Install the pinned Node.js and Yarn toolchain

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        package-manager-cache: false

    - name: Verify vendored Yarn
      run: node .yarn/releases/yarn-4.11.0.cjs --version
      shell: bash

    - name: Install dependencies
      run: node .yarn/releases/yarn-4.11.0.cjs install --immutable
      shell: bash
